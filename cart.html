<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart — Lumora Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
    <link rel="stylesheet" href="css/premium.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><span class="logo-icon">◈</span><span class="logo-text">LUMORA</span></a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Store</a></li>
                <li><a href="cart.html" class="nav-link active">Cart <span class="cart-count" id="cartCount">0</span></a></li>
                <span id="authLinks"></span>
            </ul>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </nav>
    <div class="cart-container" id="cartContainer"></div>
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal modal-large">
            <button class="modal-close" onclick="closeModal()">×</button>
            <h2 class="modal-title">Checkout</h2>
            <div id="checkoutFormStep">
                <form id="orderForm" class="order-form">
                    <div class="form-group"><label for="name">Full Name *</label><input type="text" id="name" name="name" required placeholder="Enter your full name"></div>
                    <div class="form-row">
                        <div class="form-group"><label for="phone">Phone Number *</label><input type="tel" id="phone" name="phone" required placeholder="10-digit mobile number" pattern="[0-9]{10}" maxlength="10"></div>
                        <div class="form-group"><label for="email">Email (optional)</label><input type="email" id="email" name="email" placeholder="your@email.com"></div>
                    </div>
                    <div class="form-group"><label for="address">Address *</label><textarea id="address" name="address" required placeholder="House/Flat no., Street, Area" rows="2"></textarea></div>
                    <div class="form-row">
                        <div class="form-group"><label for="city">City *</label><input type="text" id="city" name="city" required placeholder="City"></div>
                        <div class="form-group"><label for="state">State *</label><input type="text" id="state" name="state" required placeholder="State"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label for="pincode">PIN Code *</label><input type="text" id="pincode" name="pincode" required placeholder="6-digit PIN" pattern="[0-9]{6}" maxlength="6"></div>
                        <div class="form-group"><label for="landmark">Landmark (optional)</label><input type="text" id="landmark" name="landmark" placeholder="Near..."></div>
                    </div>
                    <button type="submit" class="btn btn-primary submit-btn">Proceed to Payment</button>
                </form>
            </div>
            <div id="checkoutPaymentStep" style="display:none"><div id="paymentSection"></div></div>
        </div>
    </div>
    <div id="orderConfirmation" style="display:none"></div>
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-brand">
                <a href="index.html" class="logo"><span class="logo-icon">◈</span><span class="logo-text">LUMORA</span></a>
                <p>Tech essentials for the next generation.</p>
            </div>
            <div class="footer-links">
                <div class="footer-col"><h4>Shop</h4><a href="index.html#products">All Products</a><a href="index.html#products">Phone Cases</a><a href="index.html#products">Stickers</a><a href="index.html#products">LED Lights</a></div>
                <div class="footer-col"><h4>Help</h4><a href="#">Shipping Info</a><a href="#">Returns</a><a href="#">Contact Us</a><a href="#">FAQ</a></div>
                <div class="footer-col"><h4>Follow</h4><a href="https://instagram.com/lumora.main5" target="_blank">Instagram</a><a href="#">Telegram</a><a href="#">WhatsApp</a></div>
            </div>
        </div>
        <div class="footer-bottom"><p>&copy; 2026 Lumora. All rights reserved.</p></div>
    </footer>
    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
    <script src="js/premium.js"></script>
</body>
</html>
